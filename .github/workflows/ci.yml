name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Build
    strategy:
      matrix:
        os: [ windows-latest, ubuntu-latest ]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history — the roadmap audit greps git log for feature-ID commits

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Go Vet
        run: go vet ./...

      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "gofmt needed on:"; echo "$unformatted"; exit 1; fi

      - name: Run Tests
        run: go test -v ./...

      - name: Build Binary
        run: go build -v -o ${{ runner.os == 'Windows' && 'bxw.exe' || 'bxw' }} .

      - name: Version Stamp Smoke
        shell: bash
        run: |
          EXE=bxw_vtest
          [ "${{ runner.os }}" = "Windows" ] && EXE=bxw_vtest.exe
          go build -ldflags "-X bxw/internal/app.Version=ci-stamp-test" -o "$EXE" .
          out=$(./"$EXE" version)
          echo "$out"
          echo "$out" | grep -q "ci-stamp-test" || { echo "FAIL: version not stamped via bxw/internal/app.Version (check release ldflags target)"; exit 1; }
          rm -f "$EXE"

      - name: Roadmap Dashboard Audit
        shell: bash
        run: bash scripts/verify-roadmap.sh

      - name: Smoke Test (Windows)
        if: runner.os == 'Windows'
        run: |
          .\bxw.exe doctor
          .\bxw.exe list browsers

